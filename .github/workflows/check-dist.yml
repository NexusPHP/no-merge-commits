name: Build Updated Distributable

on:
  workflow_dispatch:
  push:
    branches:
      - '2.x'
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 0 * * *' # Run at 00:00 UTC

permissions: {}

concurrency:
  group: check-dist
  cancel-in-progress: false

jobs:
  check-dist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'

      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules
          key: ${{ github.job }}-node-24-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ github.job }}-node-24-

      - name: List the state of dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm list

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dist/ directory
        run: |
          npm run build
          npm run package

      - name: Compare the expected and actual dist/ directories
        run: |
          if [[ -n "$(git status --porcelain 2>/dev/null)" ]]; then
            echo "DIFF=true" >> $GITHUB_OUTPUT

            echo "Detected uncommitted changes after build. See status below:"
            git diff --text --ignore-space-at-eol
          fi
        id: diff

      - name: Create pull request if updated version is different
        if: steps.diff.outputs.DIFF == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_ACTIONS_TOKEN }}
          commit-message: Update rebuilt distributable
          branch: update-build-dist
          delete-branch: true
          base: '2.x'
          title: '[automated] update rebuilt distributable'
          labels: type/enhancement
