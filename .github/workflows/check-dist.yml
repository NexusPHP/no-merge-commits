name: Build Updated Distributable

on:
  workflow_dispatch:
  push:
    branches:
      - '2.x'
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 0 * * *' # Run at 00:00 UTC

permissions: {}

concurrency:
  group: check-dist
  cancel-in-progress: false

jobs:
  check-dist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.x'

      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ${{ github.job }}-node-24-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ github.job }}-node-24-

      - name: List the state of dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm list

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dist/ directory
        run: |
          npm run build
          npm run package

      - name: Compare the expected and actual dist/ directories
        run: |
          if [[ -n "$(git status --porcelain 2>/dev/null)" ]]; then
            echo "DIFF=true" >> $GITHUB_OUTPUT

            echo "Detected uncommitted changes after build. See status below:"
            git diff --text --ignore-space-at-eol
          fi
        id: diff

      - name: Create pull request if updated version is different
        if: steps.diff.outputs.DIFF == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.RELEASE_ACTIONS_TOKEN }}
          commit-message: Update rebuilt distributable
          branch: update-build-dist
          delete-branch: true
          base: '2.x'
          title: '[automated] update rebuilt distributable'
          labels: type/enhancement
