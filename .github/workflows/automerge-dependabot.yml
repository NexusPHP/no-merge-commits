name: Auto-Merge Dependabot Updates

on:
  pull_request:
    branches:
      - '2.x'
    paths:
      - '.github/workflows/**'
      - package.json
      - package-lock.json

permissions:
  pull-requests: write

concurrency:
  group: automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Enable Auto-Merge for Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Approve Dependabot PR
        run: gh pr review --approve "${{ env.PR_URL }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_ACCESS_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash --delete-branch "${{ env.PR_URL }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_ACCESS_TOKEN }}
